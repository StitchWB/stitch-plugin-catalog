name: Update catalog index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-index:
    name: Rebuild catalog.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild index
        run: python scripts/update_index.py

      - name: Commit index (skip ci)
        run: |
          if git diff --quiet catalog.json; then
            echo "catalog.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "chore(index): rebuild catalog.json [skip ci]"
          git push
