name: Validate catalog index

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: catalog-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint catalog.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint catalog.json
        run: python scripts/validate_catalog.py catalog.json
